<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Giveaway</title>
<style>
body{margin:0;font-family:Arial;background:#090b14;overflow:hidden;color:#fff}
.bg{position:fixed;inset:0;background:radial-gradient(circle at top,#143,#090b14 60%)}
.bg:before,.bg:after{content:"";position:absolute;width:200vmax;height:200vmax;background:conic-gradient(from 0deg,#0f06,#0000,#0ff3,#0000,#ff03);animation:spin 25s linear infinite;left:-50%;top:-50%;filter:blur(60px)}
.bg:after{animation-direction:reverse;opacity:.4}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;z-index:1;max-width:520px;margin:40px auto;background:rgba(255,255,255,.08);backdrop-filter:blur(15px);padding:24px;border-radius:22px;border:1px solid #3f6;box-shadow:0 0 30px #0f45}
h1{text-align:center;color:#7fff7f}
.drop{border:2px dashed #6f6;border-radius:14px;padding:18px;margin:14px 0;text-align:center}
input[type=file],input[type=text]{width:100%;padding:12px;border-radius:10px;border:none;margin-top:10px}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#00d26a;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
button:hover{transform:scale(1.02)}
#step2,#done{display:none}
.loader{width:70px;height:70px;border:8px solid #333;border-top-color:#0f6;border-radius:50%;margin:20px auto;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.note{text-align:center;color:#ccc}
</style></head>
<body>
<div class="bg"></div>
<div class="card" id="step1">
<h1>🎉 ₹150 Giveaway</h1>
<p class="note">Upload your YouTube Subscribe and Instagram Follow screenshots.</p>
<div class="drop">📺 YouTube Subscribe Proof<input id="yt" type="file" accept="image/*"></div>
<div class="drop">📷 Instagram Follow Proof<input id="ig" type="file" accept="image/*"></div>
<button onclick="go()">Continue</button>
</div>
<div class="card" id="step2">
<div class="loader"></div>
<h2 style="text-align:center">Processing your files...</h2>
<p class="note">Receiving uploads... Preparing your giveaway entry...</p>
</div>
<div class="card" id="done">
<h1>✅ Files Received</h1>
<input id="insta" type="text" placeholder="Enter Instagram Username">
<button onclick="finish()">Submit Entry</button>
</div>
<script>
function go(){
if(!yt.files.length||!ig.files.length){alert("Please upload both screenshots.");return;}
step1.style.display='none';step2.style.display='block';
setTimeout(()=>{step2.style.display='none';done.style.display='block';},2500);
}
function finish(){
let v=insta.value.trim();
if(!v){alert("Enter Instagram username.");return;}
done.innerHTML=`<h1 style="color:#7fff7f">🎉 Thank You!</h1>
<p style="line-height:1.8;text-align:center">
Your giveaway entry has been submitted.<br><br>
Instagram: <b>@${v}</b><br><br>
🍀 One lucky participant will receive a <b style="color:gold">₹150 Redeem Code</b>.<br><br>
Winner will be announced on YouTube & Instagram.
</p>`;
}
</script>
</body></html>
